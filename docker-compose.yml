name: trabajos-vps
services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: trabajos
      POSTGRES_USER: trabajos
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate .env first}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U trabajos -d trabajos']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  minio:
    image: trabajos-minio:2025-10-15
    build: ./deploy/minio
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?Generate .env first}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?Generate .env first}
    volumes: [minio_data:/data]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  onlyoffice:
    image: onlyoffice/documentserver:9.3.1
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Generate .env first}
      JWT_HEADER: Authorization
      JWT_IN_BODY: 'true'
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
      ALLOW_META_IP_ADDRESS: 'false'
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost/healthcheck]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: trabajos
      DB_USER: trabajos
      DB_PASSWORD: ${DB_PASSWORD}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3200}
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-http://localhost:8081}
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_CALLBACK_BASE_URL: http://backend:4000
      ONLYOFFICE_DOWNLOAD_ORIGINS: http://onlyoffice,${ONLYOFFICE_PUBLIC_URL:-http://localhost:8081}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      DOCUMENT_TOKEN_SECRET: ${DOCUMENT_TOKEN_SECRET:?Generate .env first}
      RECOVERY_PEPPER: ${RECOVERY_PEPPER:?Generate .env first}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: loopback,linklocal,uniquelocal
      STORAGE_DRIVER: s3
      STORAGE_ENDPOINT: minio
      STORAGE_PORT: 9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: trabajos
      ADMIN_NAME: Administrador de trabajos
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Generate .env first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Generate .env first}
      SEED_ENABLED: 'false'
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      onlyoffice: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  frontend:
    build: ./frontend
    restart: unless-stopped
  nginx:
    image: nginx:1.28.2-alpine
    ports: ['0.0.0.0:3200:80', '0.0.0.0:8081:8081']
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx:/etc/nginx/snippets:ro
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_started}
    restart: unless-stopped
volumes:
  postgres_data:
  minio_data:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
  onlyoffice_db:
