map $http_upgrade $connection_upgrade { default upgrade; '' close; }
include /etc/nginx/snippets/upstreams.conf;
log_format private_access '$remote_addr $request_method $uri $status';
access_log /var/log/nginx/access.log private_access;
server {
  listen 80;
  server_name trabajos.rctveracruz.org docs.rctveracruz.org;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl;
  server_name trabajos.rctveracruz.org;
  ssl_certificate /etc/nginx/certs/trabajos/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/trabajos/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  include /etc/nginx/snippets/app.locations;
}
server {
  listen 443 ssl;
  server_name docs.rctveracruz.org;
  ssl_certificate /etc/nginx/certs/docs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/docs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;
  include /etc/nginx/snippets/docs.locations;
}
