map $http_upgrade $connection_upgrade { default upgrade; '' close; }
include /etc/nginx/snippets/upstreams.conf;
log_format private_access '$remote_addr $request_method $uri $status';
access_log /var/log/nginx/access.log private_access;
server { listen 80; server_name _; include /etc/nginx/snippets/app.locations; }
server { listen 8081; server_name _; include /etc/nginx/snippets/docs.locations; }
