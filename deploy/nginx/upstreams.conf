resolver 127.0.0.11 valid=10s ipv6=off;
map $http_x_forwarded_proto $public_scheme {
  default $scheme;
  https https;
}
upstream api_upstream { zone api_upstream 64k; server backend:4000 resolve; }
upstream web_upstream { zone web_upstream 64k; server frontend:80 resolve; }
upstream docs_upstream { zone docs_upstream 64k; server onlyoffice:80 resolve; }
